name: Claude Code Review

# Reviews each pull request once, when it's opened, reopened or marked ready.
# Add `synchronize` to the types to re-review on every push (each review runs
# six Opus agents, so that uses subscription limits quickly).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts wait until they're marked ready. Pull requests from forks don't get
    # repository secrets, so they can't authenticate.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      # Every model alias resolves to Opus 5.5, so the review agents and the
      # action's background work all run on it.
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opus-5-5
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-opus-5-5
      # A one-shot CI run ends when Claude's turn ends, killing anything still
      # running in the background. This makes every agent run in the foreground.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with specialist agents
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The command lives in .claude/commands/review-pr.md and posts inline
          # comments plus a "## Claude review" summary. The action reads .claude/
          # from the default branch, never from the PR under review.
          prompt: '/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}'
          # --allowedTools: headless runs deny any tool that isn't listed, and
          #   the review needs these to read the PR and post its findings.
          # --disallowedTools: the reviewer never edits files, and the
          #   wait-for-later tools end a one-shot run before the review is done.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Write,Edit,NotebookEdit,ScheduleWakeup,SendMessage,Monitor"
            --append-system-prompt "This is a one-shot CI run: ending your turn ends the process, and nothing will resume it later. Do not end your turn until the review summary has been posted to the pull request."

      # Prints which tools and agents the review used, and which calls were
      # denied, by name only. The transcript itself stays private: this repo's
      # logs are public, and tool output can include anything Claude read.
      - name: Log tool and agent usage (names only)
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "No transcript, so Claude didn't run. A PR that edits this workflow is skipped by design."
            exit 0
          fi
          jq -r '
            def short: tostring | [splits("\\s+")] | map(select(. != "") | .[0:40]) | .[0:3] | join(" ");
            def name_of: if .name == "Bash" then "Bash(" + ((.input.command // "") | short) + ")"
              elif .name == "Agent" or .name == "Task" then "Agent(" + ((.input.subagent_type // "general-purpose") | tostring) + ")"
              else .name end;
            def tally: group_by(.) | map("  \(length)x \(.[0])") | if length == 0 then ["  none"] else . end | .[];
            [.[] | select(.type == "assistant") | (.parent_tool_use_id != null) as $sub
              | .message.content[]? | select(.type == "tool_use") | {sub: $sub, id, label: name_of}] as $uses
            | (reduce $uses[] as $u ({}; .[$u.id] = $u.label)) as $byid
            | [.[] | select(.type == "user") | .message.content[]?
              | select(.type == "tool_result" and .is_error == true) | $byid[.tool_use_id] // "unknown"] as $errors
            | ([.[] | select(.type == "result")] | last // {}) as $r
            | "Turns: \($r.num_turns // "?"), duration: \(($r.duration_ms // 0) / 1000 | floor)s, is_error: \($r.is_error | if . == null then "?" else tostring end)",
              "Tool calls in the main session:", ([$uses[] | select(.sub | not) | .label] | tally),
              "Tool calls inside agents:", ([$uses[] | select(.sub) | .label] | tally),
              "Denied calls: \($r.permission_denials_count // ($r.permission_denials // [] | length))",
              ([($r.permission_denials // [])[] | if .tool_name == "Bash" then "Bash(" + ((.tool_input.command // "") | short) + ")" else .tool_name end]
                | if length == 0 then empty else tally end),
              "Calls that returned an error (includes denials):", ($errors | tally)
          ' "$EXECUTION_FILE"
