name: Claude Code

# Runs when someone with write access mentions @claude in an issue, a PR
# comment or a review. Claude can answer, and push commits or open PRs.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Lets Claude read CI results on PRs
    env:
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opus-5-5
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-opus-5-5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Same one-shot safeguards as the review workflow: nothing can resume
          # after the run ends, so work must finish in the foreground.
          claude_args: |
            --model claude-opus-5-5
            --disallowedTools "ScheduleWakeup,SendMessage,Monitor"
            --append-system-prompt "This is a one-shot CI run: ending your turn exits the process and kills any background work, and nothing will wake you later. Launch every subagent with run_in_background set to false, and do not end your turn until your reply or your changes have been posted."
